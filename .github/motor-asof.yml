name: Guarismo motor as-of (manual, solo lectura)

# Workflow MANUAL de motor/asof.py: las PIEZAS 2 Y 3 del motor de informes.
# NO tiene reloj y no lo va a tener.
#
# QUE HACE (Plan del motor, 14-oct · consultas 21.6-A, 23.1-A y 23.8-B)
#   "Que decia la serie S para el periodo P el dia D", con su origen: objeto
#   de R2, sha256, huella de la serie, hora de captura con zona, clase y dia
#   de sello. Con una segunda fecha, las dos lado a lado: IGUAL o DISTINTO.
#   Regla 23.8-B: solo vale una captura OK de ESE dia; si no hay, tarjeta de
#   hueco (y la captura OK mas cercana, como dato aparte, nunca como
#   respuesta). Deja el resultado como archivo adjunto a la corrida.
#
# SOLO LECTURA
#   Lleva solo las credenciales R2_* (las mismas del indice). NO lleva
#   SUPABASE_*. El unico archivo que escribe es asof.json, en la maquina de
#   la corrida, que se adjunta y no toca R2 ni el repo.
#
# LOS CAMPOS PASAN POR VARIABLE DE ENTORNO, nunca directo al comando, y el
# script los valida con un patron fijo (fecha AAAA-MM-DD, periodo AAAA-MM o
# AAAA-MM-DD, serie en minusculas y guion bajo). Lo raro sale con codigo 2.
#
# QUE MIRAR EN EL LOG
#   · "indice: N snapshots": los mismos que el indice del dia.
#   · VALOR / VACIO / PERIODO_FUERA con su objeto, sha, huella y sello.
#   · HUECO o SIN_CAPTURA: no hay numero, y esta bien que no lo haya.
#   · "✗ el lector no pudo comprobar la captura": grave. No se entrega nada.

on:
  workflow_dispatch:
    inputs:
      serie:
        description: "Serie (ej.: emae_desest)"
        required: true
        default: "emae_desest"
      periodo:
        description: "Periodo del dato (AAAA-MM, o AAAA-MM-DD si la serie es diaria)"
        required: true
        default: "2026-07"
      fecha:
        description: "Dia de la captura (AAAA-MM-DD, hora argentina)"
        required: true
      fecha2:
        description: "Segundo dia, para comparar (opcional, AAAA-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  asof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install boto3

      - name: As-of del archivo (solo lectura)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: guarismo-crudo
          SERIE: ${{ inputs.serie }}
          PERIODO: ${{ inputs.periodo }}
          FECHA: ${{ inputs.fecha }}
          FECHA2: ${{ inputs.fecha2 }}
        run: python motor/asof.py --serie="$SERIE" --periodo="$PERIODO" --fecha="$FECHA" --fecha2="$FECHA2" --salida=asof.json

      - name: Adjuntar el resultado a la corrida
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asof-${{ github.run_id }}
          path: asof.json
          retention-days: 30
          if-no-files-found: warn
