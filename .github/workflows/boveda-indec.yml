name: Guarismo boveda (cuadros INDEC)

# Captura diaria de los cuadros publicados del INDEC a R2, prefijo
# boveda/indec/. El binario se sube solo si cambio; el manifiesto se escribe
# todos los dias. No toca Supabase ni la vitrina.
#
# El INDEC sobrescribe sus cuadros conservando el mismo nombre: la URL no
# cambia, el contenido si. Lo que no se captura el dia que estaba, no se
# recupera nunca.
#
# EL RELOJ ES cron-job.org disparando workflow_dispatch. El bloque schedule
# queda solo como red pasiva: el cron nativo de GitHub descarta corridas en
# silencio. Al mirar Actions, filtrar por workflow_dispatch.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "35 22 * * *"     # 19:35 ARG, best effort, NO se cuenta con esto

jobs:
  indec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests boto3

      - name: Capturar cuadros del INDEC a R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: guarismo-crudo
        run: python boveda_indec.py
