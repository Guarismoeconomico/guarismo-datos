name: Guarismo boveda diaria

# Corre TODOS los modulos de boveda de cadencia diaria en secuencia, con un
# solo reloj. Son SEIS: datos.gob.ar, INDEC, BCRA, mecanica D, Comtrade y
# privadas (BCR/GEA).
#
# OJO: los cinco primeros escriben en guarismo-crudo; el sexto escribe en
# guarismo-reservado con OTRAS credenciales. La separacion es de CREDENCIAL,
# no de convencion: ver el comentario del paso de privadas al final.
#
# Por que agrupado por CADENCIA y no por fuente: un workflow por modulo son
# doce relojes en dos meses, y el dia que se regenere el PAT hay que tocarlos
# todos. Agrupado, sumar un modulo diario nuevo es UN PASO MAS en este archivo
# y cero cronjobs nuevos.
#
# Cada modulo despues del primero lleva `if: always()`: que un modulo falle NO
# puede impedir que corran los siguientes. Un modulo caido deja un hueco
# registrado en su propio log; que ese hueco arrastre a los demas seria
# multiplicar la perdida. El job igual queda en ROJO si algun paso fallo, asi
# la alerta suena.
#
# Los modulos devuelven 0 con huecos (un hueco registrado es la conducta
# correcta, no una falla), 1 si fallaron TODAS las fuentes, 3 si fallo R2.
#
# EL RELOJ ES cron-job.org disparando workflow_dispatch, y es el UNICO.
#
# El bloque `schedule` estuvo un tiempo como red pasiva y se saco el 4-sep-2026,
# con la prueba en la mano: el 3-sep GitHub disparo la corrida programada para
# las 22:15 UTC a las 00:04 UTC del dia siguiente — UNA HORA Y CUARENTAINUEVE
# MINUTOS TARDE — y produjo una segunda captura completa del dia (run #15,
# "Scheduled"), duplicando ~1 MB diarios de BCRA contra el limite de 10 GB de
# R2. Una red que se dispara a una hora impredecible no es una red: es ruido
# con costo. Si el reloj externo falla, la conducta correcta es un HUECO
# REGISTRADO, no una captura a deshora.
#
# OJO AL MIRAR ACTIONS: las corridas disparadas por cron-job.org aparecen como
# "Manually run by Guarismoeconomico", porque el PAT es de esa cuenta. La UI de
# GitHub NO distingue el reloj de un clic manual. Para saber si el reloj corrio
# de verdad, se mira el HISTORIAL DE EJECUCIONES DE cron-job.org (HTTP 204 con
# su hora), nunca esta pantalla.

on:
  workflow_dispatch: {}

jobs:
  boveda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests boto3

      # --- Modulos diarios, en secuencia -------------------------------------
      # Para sumar uno nuevo: copiar un bloque, cambiar el name y el script.
      # No hace falta cronjob nuevo.

      - name: Snapshot completo de datos.gob.ar a R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: guarismo-crudo
        run: python boveda_datosgob.py

      - name: Capturar cuadros del INDEC a R2
        if: always()          # corre aunque el modulo anterior haya fallado
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: guarismo-crudo
        run: python boveda_indec.py

      - name: Capturar BCRA a R2 (catalogo + principales)
        if: always()          # corre aunque los modulos anteriores hayan fallado
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: guarismo-crudo
        run: python boveda_bcra.py

      # Mecanica D: paginas fijas con listado (Hacienda fiscal + Finanzas deuda).
      #
      # POR QUE ENTRA AL DIARIO SI LAS FUENTES SON MENSUAL Y TRIMESTRAL
      #   Porque lo que se mide es CUANDO publican. La Secretaria de Finanzas
      #   no publica calendario: la deuda del II trimestre 2026 tiene que
      #   aparecer a fin de septiembre y nadie dice que dia. Mirando todos los
      #   dias, el archivo registra la fecha exacta. Con cadencia trimestral esa
      #   fecha se pierde para siempre, y es la serie de puntualidad del Tier 4.
      #
      # QUE CUESTA EN REGIMEN: cero.
      #   Verificado el 7-sep-2026: la corrida normal da "14 OK · 0 nuevos" y
      #   escribe CERO bytes. Se bajan ~7,7 MB y el gatillo decide que no hay
      #   nada nuevo. Solo escribe el dia que el organismo publica.
      #
      # SIN RELOJ PROPIO: entra a este workflow, que ya tiene el suyo. Un
      # modulo nuevo NO agrega un cronjob mas a cron-job.org.
      #
      # El BACKFILL no corre aca. Vive en boveda-mecanicad-manual.yml y se
      # dispara a mano.
      - name: Capturar mecanica D a R2 (Hacienda + Finanzas)
        if: always()          # corre aunque los modulos anteriores hayan fallado
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: guarismo-crudo
        run: python boveda_mecanicad.py

      # Comtrade: capa de ALARMA de UN Comtrade (mecanica E, API con token).
      #
      # POR QUE ENTRA AL DIARIO
      #   La ONU declara por escrito que mantiene UNA SOLA VERSION de cada
      #   dataset: cuando un pais corrige lo que declaro, la version corregida
      #   REEMPLAZA a la anterior y no queda archivo de la previa.
      #
      #   getDa entrega solo firstReleased y lastReleased. Si un dataset se
      #   reviso cinco veces, las tres del medio NO EXISTEN en la respuesta de
      #   hoy: las tapo el ultimo lastReleased. Mirando todos los dias, cada
      #   revision queda fechada por nosotros. Con cualquier otra cadencia, las
      #   intermedias se pierden para siempre.
      #
      # QUE CUESTA EN REGIMEN
      #   14 llamadas a la API (presupuesto propio de 20: la fuente NO declara
      #   su cuota en ningun header, medido el 8-sep-2026) y ~43 KB por dia.
      #
      # NO BAJA EL DATO ESPEJO. Esta es la capa de alarma. La capa 2 va
      # gatillada por esta, igual que la mecanica D baja archivos cuando la
      # pagina cambia.
      #
      # SIN RELOJ PROPIO: entra a este workflow. Cero cronjobs nuevos.
      - name: Capturar alarma de Comtrade a R2
        if: always()          # corre aunque los modulos anteriores hayan fallado
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: guarismo-crudo
        run: python boveda_comtrade.py

      # Privadas: BCR/GEA al almacen RESERVADO (mecanica F).
      #
      # POR QUE ENTRA AL DIARIO SI LA FUENTE PUBLICA UNA VEZ POR MES
      #   Por dos razones, y la segunda es la que manda.
      #   1) El gatillo NO es el article:modified_time del listado, que esta
      #      congelado en 2019 mientras el contenido cambia todos los meses. Se
      #      gatilla por APARICION DE CLAVE, y eso solo funciona mirando todos
      #      los dias.
      #   2) El manifiesto se escribe TODOS los dias, aunque no pase nada: es la
      #      constancia de "mire y no habia nada". Sin eso no hay Clase A, hay
      #      silencio. Cada dia sin manifiesto es un hueco en la cadena.
      #
      # QUE CUESTA EN REGIMEN: un request al listado por dia.
      #
      # SEPARACION DE ALMACEN, Y ES DE CREDENCIAL
      #   Este paso recibe SOLO R2_RESERVADO_*. NUNCA se le agregan
      #   R2_ACCESS_KEY_ID ni R2_SECRET_ACCESS_KEY: el proceso que captura
      #   privadas no tiene en su entorno las llaves del archivo publicable, ni
      #   siquiera para leer. Si algun dia las necesitara, tiene que ser una
      #   decision explicita y no un copiar-y-pegar del paso de arriba.
      #   Tampoco lleva R2_BUCKET: el modulo lee R2_BUCKET_RESERVADO y trae su
      #   propio default.
      #
      # EDITADO distinto de cero NO es un error: es BCR editando un informe ya
      # publicado. Es la alarma funcionando.
      #
      # El BACKFILL no corre aca. Vive en boveda-privadas-manual.yml.
      - name: Capturar privadas (BCR/GEA) al almacen reservado
        if: always()          # corre aunque los modulos anteriores hayan fallado
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_RESERVADO_ACCESS_KEY_ID: ${{ secrets.R2_RESERVADO_ACCESS_KEY_ID }}
          R2_RESERVADO_SECRET_ACCESS_KEY: ${{ secrets.R2_RESERVADO_SECRET_ACCESS_KEY }}
        run: python boveda_privadas.py
