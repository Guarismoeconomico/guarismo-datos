name: Datos intradia (dolar + mercado)

on:
  schedule:
    - cron: "8,38 13-20 * * 1-5"
  workflow_dispatch: {}

jobs:
  intradia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - name: Bajar dolar/mercado y escribir en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python guarismo_conector.py intradia
