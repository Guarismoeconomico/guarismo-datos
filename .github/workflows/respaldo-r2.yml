name: Respaldo crudo a R2

# El bloque schedule queda SOLO como respaldo. El reloj real es cron-job.org
# disparando workflow_dispatch (el cron de GitHub descarta corridas en silencio).
on:
  schedule:
    - cron: "40 8 * * *"     # 05:40 ARG, best effort, NO se cuenta con esto
  workflow_dispatch: {}

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests boto3

      - name: Respaldar guarismo_crudo a Cloudflare R2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: guarismo-crudo
        run: python respaldo_s3.py
